# Static PWA. TLS, rate limits and security headers are handled by Cloudflare and
# the Traefik middlewares in front; /api, /admin and /static never reach this pod.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The exercise library's pictures, served at /ex/ (see
    # apps/planning/library_views.MEDIA_PREFIX). This block was written for an
    # earlier /exercises/ prefix and silently did nothing after the rename:
    # the files fell through to the SPA fallback below, so a missing picture
    # answered 200 with index.html instead of 404 — a broken image rather than
    # a clean miss — and 1,319 files got the default four-hour cache.
    #
    # Not `immutable` like /assets/, because these paths are not content
    # hashed: a re-import writing a different picture to the same path has to
    # be able to reach people. A month is long enough that a phone browsing
    # the library does not re-fetch them, and short enough that a correction
    # is not stuck behind a year.
    location /ex/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # These must be revalidated every time, or users stay on an old release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
