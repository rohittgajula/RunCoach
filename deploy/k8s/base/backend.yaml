apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Keep the old Pod serving until the new one is Ready (migrations done, health ok).
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/rohittgajula/runcoach-backend
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: {name: runcoach-config}
            - secretRef: {name: runcoach-secrets}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: backend
          image: ghcr.io/rohittgajula/runcoach-backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: {name: runcoach-config}
            - secretRef: {name: runcoach-secrets}
          # Probes send the public Host header so DJANGO_ALLOWED_HOSTS stays strict.
          # Keep serving while Traefik drops this pod from its endpoints, so a
          # rollout never answers 502 from a pod that is already shutting down.
          lifecycle:
            preStop:
              sleep: {seconds: 10}
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: runcoach.rohitgajula.in
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live/
              port: http
              httpHeaders:
                - name: Host
                  value: runcoach.rohitgajula.in
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live/
              port: http
              httpHeaders:
                - name: Host
                  value: runcoach.rohitgajula.in
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 100m, memory: 300Mi}
            limits: {memory: 700Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: media, mountPath: /app/media}
            - {name: garmin-tokens, mountPath: /app/.garmin}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: media
          persistentVolumeClaim: {claimName: media}
        - name: garmin-tokens
          persistentVolumeClaim: {claimName: garmin-tokens}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
