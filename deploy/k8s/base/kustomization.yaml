# RunCoach on k3s. Render with: kubectl kustomize deploy/k8s/overlays/prod
#
# Secrets are NOT here and never will be (the repo is public). Two must exist in
# the namespace before the app starts; deploy/scripts/push-secrets.sh creates them:
#   runcoach-secrets     every key from deploy/secrets/prod.env
#   runcoach-origin-tls  Cloudflare Origin Certificate (tls.crt / tls.key)
# Optional: runcoach-r2 (R2_* keys) turns on off-site backup upload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: runcoach

labels:
  - pairs:
      app.kubernetes.io/part-of: runcoach

resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - workers.yaml
  - frontend.yaml
  - middlewares.yaml
  - ingressroute.yaml
  - backup.yaml

# CI pins these to the commit sha (kustomize edit set image in overlays/prod).
images:
  - name: ghcr.io/rohittgajula/runcoach-backend
    newTag: latest
  - name: ghcr.io/rohittgajula/runcoach-frontend
    newTag: latest
