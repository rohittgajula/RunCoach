# The repo (and so its GHCR images) is private: every pod in the namespace pulls
# with the `ghcr-pull` credential. Created by deploy/scripts/push-secrets.sh from
# deploy/secrets/ghcr.env (a GitHub token with only read:packages).
# Pods using this account get no API token. Only the backend uses its own
# read-only account (admin-rbac.yaml) for the in-app admin page.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
imagePullSecrets:
  - name: ghcr-pull
automountServiceAccountToken: false
