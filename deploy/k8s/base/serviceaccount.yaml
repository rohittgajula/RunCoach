# The repo (and so its GHCR images) is private: every pod in the namespace pulls
# with the `ghcr-pull` credential. Created by deploy/scripts/push-secrets.sh from
# deploy/secrets/ghcr.env (a GitHub token with only read:packages).
# No pod talks to the Kubernetes API, so no token is mounted into them either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
imagePullSecrets:
  - name: ghcr-pull
automountServiceAccountToken: false
