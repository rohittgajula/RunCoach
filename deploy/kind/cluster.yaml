
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: runcoach
nodes: 
  - role: control-plane
    extraPortMappings :
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
    labels:
      ingress-ready: "true"
  # A worker node: where your Pods actually run.
  - role: worker
